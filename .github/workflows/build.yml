name: Build

# Pushes and pull requests build on CircleCI (.circleci/config.yml). This
# workflow keeps what needs GitHub's OIDC and release token, or a
# reproducibility rebuild: tags, releases, the weekly run, and dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner for all jobs. `beefy` targets the on-demand self-hosted
          runner — start it with `ci-runner 0typos/statics -j N` or the
          dispatched jobs will sit queued.
        type: choice
        options: [ubuntu-24.04, beefy]
        default: ubuntu-24.04
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering ref.
        type: string
        default: ""
      release_tag:
        description: >-
          Annotated tag to create on `ref` and publish once every gate passes.
          Empty builds without releasing. `ref` must be a full commit SHA.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Infrastructure failures — registry timeouts, DNS, mirror hiccups — surface
  # in the first minutes, before any component is compiled. A genuine build
  # break takes far longer to reach. Only a failure inside this window is
  # retried, and only once, so a real breakage never costs a second full build.
  RETRY_WINDOW_SECONDS: 600
  # Published by toolchain.yml and pulled as a layer cache only; see
  # scripts/docker-build.sh. Plain progress keeps every build step's log
  # readable, down to the component being compiled.
  TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/statics-toolchain:main
  BUILDKIT_PROGRESS: plain

jobs:
  changes:
    name: Detect build inputs
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Decide whether anything build-relevant changed
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Anything that is not a plain push or pull request - schedule,
          # dispatch, a release build - always builds.
          case "$EVENT" in
          pull_request)
            paths=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[].filename')
            ;;
          push)
            if [[ $BEFORE =~ ^0{40}$ ]]; then
              paths=""
            else
              paths=$(gh api "repos/$GH_REPO/compare/$BEFORE...$AFTER" \
                --jq '.files[]?.filename' || true)
            fi
            ;;
          *)
            paths=""
            ;;
          esac

          # An empty list means "could not tell": build rather than guess.
          if [[ -z $paths ]]; then
            echo "build=true" >>"$GITHUB_OUTPUT"
            echo "no usable file list; building"
            exit 0
          fi

          if printf '%s\n' "$paths" | ./scripts/build-relevant.sh --any; then
            echo "build=true" >>"$GITHUB_OUTPUT"
            echo "build inputs changed; building"
          else
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "documentation only; skipping the expensive work"
          fi
          printf '%s\n' "$paths" | sed 's/^/  /' >>"$GITHUB_STEP_SUMMARY"

  # Runs alongside the builds rather than gating them, which put ~40 s of
  # runner start-up in front of every build; release still requires it.
  validate:
    name: Validate repository
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Validate manifests and scripts
        run: ./scripts/validate.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/builders/*.sh scripts/lib/*.sh scripts/toolchain/*

  build:
    name: Build ${{ matrix.arch }}
    needs: [changes]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Hosted runners give a public repository 20 concurrent jobs, enough for
      # the whole matrix plus the reproducibility and source jobs at once; a
      # cap of 4 made a cold run four waves deep (71 min against ~15).
      max-parallel: ${{ (inputs.runner == 'beefy' && 16) || 20 }}
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv6-hardfloat
          - armv7-hardfloat
          - armv7-softfloat
          - mips
          - mipsel
          - powerpc
          - powerpc64
          - powerpc64le
          - riscv64
          - s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.build == 'true'
      - name: Compute per-arch build parallelism
        if: needs.changes.outputs.build == 'true'
        # Hosted runners are isolated VMs (one arch each) — full nproc is right.
        # beefy shares one host across the whole matrix, so divide the cores by
        # the max-parallel cap (16): every concurrent arch gets an equal slice
        # and the aggregate never oversubscribes (the thrash that starved
        # buildkit's gRPC stream and failed Reproducibility on the first run).
        run: |
          if [ "${{ inputs.runner }}" = "beefy" ]; then
            j=$(( $(nproc) / 16 ))
            if [ "$j" -lt 1 ]; then j=1; fi
          else
            j=$(nproc)
          fi
          echo "JOBS=$j" >> "$GITHUB_ENV"
          echo "per-arch make -j budget: $j (nproc=$(nproc), runner=${{ inputs.runner || 'hosted' }})"
      - name: Toolchain (published image as cache)
        if: needs.changes.outputs.build == 'true'
        run: >-
          ./scripts/retry-once.sh .build/none
          ./scripts/docker-build.sh toolchain --output type=cacheonly
      - name: Fetch and verify upstream sources
        if: needs.changes.outputs.build == 'true'
        run: >-
          ./scripts/retry-once.sh .build/none
          ./scripts/docker-build.sh sources --output type=cacheonly
      - name: Mark the build start
        if: needs.changes.outputs.build == 'true'
        run: echo "build_started=$(date +%s)" >>"$GITHUB_ENV"
      - name: Compile ${{ matrix.arch }}
        if: needs.changes.outputs.build == 'true'
        id: build
        # mode=min caches only the final artifact layer (~50 MB), keyed on the
        # whole stage chain, so unchanged inputs still skip the compile. mode=max
        # also stored the toolchain and sources layers in every arch's scope,
        # ~1.5 GB each, and the matrix evicted itself from the 10 GB cache.
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: artifact
          build-args: |
            ARCH=${{ matrix.arch }}
            JOBS=${{ env.JOBS }}
          outputs: type=local,dest=dist
          cache-from: |
            type=registry,ref=${{ env.TOOLCHAIN_IMAGE }}
            type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}
      - name: Classify a failed build
        id: classify
        if: steps.build.outcome == 'failure'
        run: ./scripts/retry-window.sh "$build_started"
      - name: Retry ${{ matrix.arch }} once
        if: steps.classify.outputs.retry == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: artifact
          build-args: |
            ARCH=${{ matrix.arch }}
            JOBS=${{ env.JOBS }}
          outputs: type=local,dest=dist
          cache-from: |
            type=registry,ref=${{ env.TOOLCHAIN_IMAGE }}
            type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}
      - name: Fail on an unretried build failure
        if: >-
          steps.build.outcome == 'failure' &&
          steps.classify.outputs.retry != 'true'
        run: exit 1
      - name: Install QEMU
        # Hosted runners only: the self-hosted `beefy` host provides
        # qemu-user-static and binfmt itself (and has no apt).
        if: needs.changes.outputs.build == 'true' && inputs.runner != 'beefy'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes qemu-user-static
      - name: Verify and package
        if: needs.changes.outputs.build == 'true'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/verify.sh "dist/$TARGET_ARCH" "$TARGET_ARCH"
          ./scripts/package.sh "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.build == 'true'
        with:
          name: statics-${{ matrix.arch }}
          path: |
            dist/statics-${{ matrix.arch }}.tar.xz
            dist/statics-${{ matrix.arch }}.tar.xz.sha256
            dist/statics-${{ matrix.arch }}.spdx.json
            dist/statics-${{ matrix.arch }}.spdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  reproducibility-build:
    name: Reproducibility build
    needs: [changes]
    # Only where the result is relied on: releases (tags and release_tag, which
    # includes the monthly release), the weekly scheduled run, and manual
    # dispatch. It is the slowest job and nothing else waits for it, so
    # skipping it on pull requests and pushes takes a warm run from ~8 to ~3
    # minutes; a nondeterminism regression then surfaces at the next weekly
    # run or release instead of on its pull request.
    if: >-
      inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    # One rebuild without cache (sources and compile; the toolchain too on a
    # release), plus headroom for one retry of a fast failure.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.build == 'true'
      - name: Choose the rebuild scope
        if: needs.changes.outputs.build == 'true'
        # Anyone who can run a workflow here can write the published toolchain
        # image, and the matrix trusts it. A release therefore rebuilds the
        # toolchain from scratch too, so a planted toolchain cannot reproduce
        # the shipped archive. Other runs reuse the image for speed.
        env:
          RELEASE: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$RELEASE" = true ]; then
            echo "TOOLCHAIN_IMAGE=" >>"$GITHUB_ENV"
            echo "TOOLCHAIN_FRESH=true" >>"$GITHUB_ENV"
            echo "release: rebuilding the toolchain without the published image"
          else
            echo "toolchain from $TOOLCHAIN_IMAGE"
          fi
      - name: Toolchain
        if: needs.changes.outputs.build == 'true'
        run: |
          fresh=()
          if [ "${TOOLCHAIN_FRESH:-}" = true ]; then
            fresh=(--no-cache-filter zig-pin --no-cache-filter toolchain)
          fi
          ./scripts/retry-once.sh .build/none \
            ./scripts/docker-build.sh toolchain "${fresh[@]}" --output type=cacheonly
      - name: Fetch and verify upstream sources without cache
        if: needs.changes.outputs.build == 'true'
        run: >-
          ./scripts/retry-once.sh .build/none
          ./scripts/docker-build.sh sources --no-cache-filter sources
          --output type=cacheonly
      - name: Compile x86-64 without cache
        if: needs.changes.outputs.build == 'true'
        # Twice the matrix's make -j, so a dependence on build parallelism
        # shows up as a mismatch without making this, the critical path, any
        # slower. On the shared beefy host it takes the same core slice as one
        # arch build and doubles that instead.
        run: |
          set -euo pipefail
          if [ "${{ inputs.runner }}" = "beefy" ]; then
            jobs=$(( $(nproc) / 16 ))
            if [ "$jobs" -lt 1 ]; then jobs=1; fi
          else
            jobs=$(nproc)
          fi
          jobs=$((jobs * 2))
          echo "reproducibility make -j budget: $jobs"
          ./scripts/retry-once.sh dist \
            ./scripts/docker-build.sh artifact \
              --no-cache-filter builder \
              --build-arg ARCH=x86_64 \
              --build-arg JOBS="$jobs" \
              --output type=local,dest=dist
          ./scripts/package.sh x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.build == 'true'
        with:
          # Deliberately outside the statics-* pattern the release publishes.
          name: reproducibility-x86_64
          path: dist/statics-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

  reproducibility:
    name: Reproducibility
    # Compares the x86-64 archive the matrix built - the one that ships, and
    # possibly from cached layers - with an independent rebuild without cache.
    needs: [changes, build, reproducibility-build]
    # Runs even when an unrelated arch failed; a missing archive fails the
    # download, so this never passes without comparing. Skipped, and so
    # passing as a required check, only when the rebuild was skipped by
    # design; a failed change detection still runs it, and it refuses.
    if: >-
      !cancelled() &&
      (needs.reproducibility-build.result != 'skipped' ||
      needs.changes.result != 'success')
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - name: Refuse to pass without knowing whether to compare
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.build == 'true'
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Download the shipped x86-64 archive
        if: needs.changes.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: statics-x86_64
          path: .build/shipped
      - name: Download the independent rebuild
        if: needs.changes.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducibility-x86_64
          path: .build/rebuilt
      - name: Compare complete build outputs
        if: needs.changes.outputs.build == 'true'
        run: >-
          ./scripts/compare-builds.sh
          .build/shipped/statics-x86_64.tar.xz
          .build/rebuilt/statics-x86_64.tar.xz

  source-bundle:
    name: Build corresponding sources
    if: github.event_name != 'pull_request'
    needs: [changes]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.build == 'true'
      - name: Mark the export start
        if: needs.changes.outputs.build == 'true'
        run: echo "build_started=$(date +%s)" >>"$GITHUB_ENV"
      - name: Export verified upstream source archives
        if: needs.changes.outputs.build == 'true'
        id: export
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: source-artifact
          outputs: type=local,dest=dist/sources
          cache-from: |
            type=registry,ref=${{ env.TOOLCHAIN_IMAGE }}
            type=gha,scope=sources
          cache-to: type=gha,mode=min,scope=sources
      - name: Classify a failed export
        id: classify
        if: steps.export.outcome == 'failure'
        run: ./scripts/retry-window.sh "$build_started"
      - name: Retry the source export once
        if: steps.classify.outputs.retry == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: source-artifact
          outputs: type=local,dest=dist/sources
          cache-from: |
            type=registry,ref=${{ env.TOOLCHAIN_IMAGE }}
            type=gha,scope=sources
          cache-to: type=gha,mode=min,scope=sources
      - name: Fail on an unretried export failure
        if: >-
          steps.export.outcome == 'failure' &&
          steps.classify.outputs.retry != 'true'
        run: exit 1
      - name: Package corresponding sources
        if: needs.changes.outputs.build == 'true'
        run: ./scripts/package-sources.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.build == 'true'
        with:
          name: statics-sources
          path: |
            dist/statics-sources.tar.xz
            dist/statics-sources.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  attest_builds:
    name: Attest ${{ matrix.arch }}
    if: >-
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      github.event.repository.visibility == 'public'
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    permissions:
      attestations: write # Record the artifact attestation.
      contents: read
      id-token: write # Sign the attestation through GitHub OIDC.
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv6-hardfloat
          - armv7-hardfloat
          - armv7-softfloat
          - mips
          - mipsel
          - powerpc
          - powerpc64
          - powerpc64le
          - riscv64
          - s390x
    steps:
      - name: Download ${{ matrix.arch }} release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: statics-${{ matrix.arch }}
          path: attest
      - name: Attest release archive and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attest/statics-${{ matrix.arch }}.tar.xz
          sbom-path: attest/statics-${{ matrix.arch }}.spdx.json

  attest_source:
    name: Attest corresponding sources
    if: >-
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      github.event.repository.visibility == 'public'
    needs: source-bundle
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    permissions:
      attestations: write # Record the artifact attestation.
      contents: read
      id-token: write # Sign the attestation through GitHub OIDC.
    steps:
      - name: Download corresponding-source assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: statics-sources
          path: attest
      - name: Attest corresponding-source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attest/statics-sources.tar.xz

  release:
    name: Publish release
    if: >-
      always() &&
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success' &&
      needs.reproducibility.result == 'success' &&
      needs.source-bundle.result == 'success' &&
      (needs.attest_builds.result == 'success' ||
      needs.attest_builds.result == 'skipped') &&
      (needs.attest_source.result == 'success' ||
      needs.attest_source.result == 'skipped')
    needs:
      - validate
      - build
      - reproducibility
      - source-bundle
      - attest_builds
      - attest_source
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    permissions:
      contents: write # Create the release tag, GitHub Release, and assets.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.ref }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: statics-*
          path: release
          merge-multiple: true
      - name: Verify downloaded assets
        run: |
          cd release
          for checksum_file in *.sha256; do
            sha256sum --check "$checksum_file"
          done
      - name: Create the annotated release tag
        if: inputs.release_tag != ''
        run: |
          set -euo pipefail
          if [[ ! $RELEASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_tag requires ref to be a full commit SHA" >&2
            exit 1
          fi
          tag_ref="repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG already exists; leaving it untouched"
            exit 0
          fi
          # The workflow token cannot sign, so record an annotated tag and the
          # reason a signature is unavailable, per the release policy.
          tag_object=$(gh api "repos/$GH_REPO/git/tags" \
            --method POST \
            --raw-field tag="$RELEASE_TAG" \
            --raw-field object="$RELEASE_SHA" \
            --raw-field type=commit \
            --raw-field message="$RELEASE_TAG
          Automated release built by $GH_REPO run $GITHUB_RUN_ID.
          Unsigned: the GitHub Actions token has no release signing key." \
            --jq '.sha')
          gh api "repos/$GH_REPO/git/refs" \
            --method POST \
            --raw-field ref="refs/tags/$RELEASE_TAG" \
            --raw-field sha="$tag_object"
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            exit 0
          fi
          publish=(gh release create "$RELEASE_TAG" release/*
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG")
          if [[ -n ${RELEASE_SHA:-} ]]; then
            publish+=(--notes "Automated release from commit \`$RELEASE_SHA\`.
          Every architecture was built and verified under QEMU, and x86-64 was
          independently rebuilt and compared, before publication. Verify the
          SHA-256 files, SBOM, and attestations before deploying, and see
          \`docs/RELEASING.md\` for what this automation does not review.")
          fi
          "${publish[@]}"
