name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifests and scripts
        run: ./scripts/validate.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/builders/*.sh scripts/lib/*.sh scripts/toolchain/*

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv6-hardfloat
          - armv7-hardfloat
          - armv7-softfloat
          - mips
          - mipsel
          - mips64
          - mips64el
          - powerpc
          - powerpc64
          - powerpc64le
          - riscv64
          - loongarch64
          - s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: artifact
          build-args: ARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static
      - name: Verify and package
        run: |
          ./scripts/verify.sh "dist/${{ matrix.arch }}" "${{ matrix.arch }}"
          ./scripts/package.sh "${{ matrix.arch }}"
      - name: Attest release archive and SBOM
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/statics-${{ matrix.arch }}.tar.xz
          sbom-path: dist/statics-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statics-${{ matrix.arch }}
          path: |
            dist/statics-${{ matrix.arch }}.tar.xz
            dist/statics-${{ matrix.arch }}.tar.xz.sha256
            dist/statics-${{ matrix.arch }}.spdx.json
            dist/statics-${{ matrix.arch }}.spdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  reproducibility:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build x86-64 twice without layer reuse
        run: |
          docker buildx build \
            --no-cache \
            --file docker/Dockerfile \
            --target artifact \
            --build-arg ARCH=x86_64 \
            --output type=local,dest=.build/repro-a \
            .
          docker buildx build \
            --no-cache \
            --file docker/Dockerfile \
            --target artifact \
            --build-arg ARCH=x86_64 \
            --output type=local,dest=.build/repro-b \
            .
      - name: Compare complete build outputs
        run: >-
          diff --recursive --no-dereference
          .build/repro-a .build/repro-b

  source-bundle:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Export verified upstream source archives
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: source-artifact
          outputs: type=local,dest=dist/sources
          cache-from: type=gha,scope=sources
          cache-to: type=gha,mode=max,scope=sources
      - name: Package corresponding sources
        run: ./scripts/package-sources.sh
      - name: Attest corresponding-source archive
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/statics-sources.tar.xz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statics-sources
          path: |
            dist/statics-sources.tar.xz
            dist/statics-sources.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - reproducibility
      - source-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statics-*
          path: release
          merge-multiple: true
      - name: Verify downloaded assets
        run: |
          cd release
          for checksum_file in *.sha256; do
            sha256sum --check "$checksum_file"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
