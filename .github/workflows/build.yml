name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering ref.
        type: string
        default: ""
      release_tag:
        description: >-
          Annotated tag to create on `ref` and publish once every gate passes.
          Empty builds without releasing. `ref` must be a full commit SHA.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Infrastructure failures — registry timeouts, DNS, mirror hiccups — surface
  # in the first minutes, before any component is compiled. A genuine build
  # break takes far longer to reach. Only a failure inside this window is
  # retried, and only once, so a real breakage never costs a second full build.
  RETRY_WINDOW_SECONDS: 600

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Validate manifests and scripts
        run: ./scripts/validate.sh
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/builders/*.sh scripts/lib/*.sh scripts/toolchain/*

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv6-hardfloat
          - armv7-hardfloat
          - armv7-softfloat
          - mips
          - mipsel
          - powerpc
          - powerpc64
          - powerpc64le
          - riscv64
          - s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Mark the build start
        run: echo "build_started=$(date +%s)" >>"$GITHUB_ENV"
      - name: Build ${{ matrix.arch }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: artifact
          build-args: ARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Classify a failed build
        id: classify
        if: steps.build.outcome == 'failure'
        run: ./scripts/retry-window.sh "$build_started"
      - name: Retry ${{ matrix.arch }} once
        if: steps.classify.outputs.retry == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: artifact
          build-args: ARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Fail on an unretried build failure
        if: >-
          steps.build.outcome == 'failure' &&
          steps.classify.outputs.retry != 'true'
        run: exit 1
      - name: Install QEMU
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes qemu-user-static
      - name: Verify and package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/verify.sh "dist/$TARGET_ARCH" "$TARGET_ARCH"
          ./scripts/package.sh "$TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statics-${{ matrix.arch }}
          path: |
            dist/statics-${{ matrix.arch }}.tar.xz
            dist/statics-${{ matrix.arch }}.tar.xz.sha256
            dist/statics-${{ matrix.arch }}.spdx.json
            dist/statics-${{ matrix.arch }}.spdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  reproducibility:
    name: Reproducibility
    needs: validate
    runs-on: ubuntu-24.04
    # Two uncached builds, plus headroom for one retry of a fast failure.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build x86-64 twice without layer reuse
        run: |
          set -euo pipefail

          window=${RETRY_WINDOW_SECONDS:-600}

          build_once() {
            docker buildx build \
              --no-cache \
              --file docker/Dockerfile \
              --target artifact \
              --build-arg ARCH=x86_64 \
              --output "type=local,dest=$1" \
              .
          }

          build_with_one_retry() {
            local dest=$1 started elapsed
            started=$(date +%s)
            if build_once "$dest"; then
              return 0
            fi
            elapsed=$(($(date +%s) - started))
            if ((elapsed > window)); then
              echo "build failed after ${elapsed}s: real failure" >&2
              return 1
            fi
            echo "build failed after ${elapsed}s: retrying once" >&2
            # Discard the partial tree so the comparison only ever sees the
            # output of a build that ran to completion.
            rm -rf "$dest"
            build_once "$dest"
          }

          build_with_one_retry .build/repro-a
          build_with_one_retry .build/repro-b
      - name: Compare complete build outputs
        run: >-
          diff --recursive --no-dereference
          .build/repro-a .build/repro-b

  source-bundle:
    name: Build corresponding sources
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Mark the export start
        run: echo "build_started=$(date +%s)" >>"$GITHUB_ENV"
      - name: Export verified upstream source archives
        id: export
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: source-artifact
          outputs: type=local,dest=dist/sources
          cache-from: type=gha,scope=sources
          cache-to: type=gha,mode=max,scope=sources
      - name: Classify a failed export
        id: classify
        if: steps.export.outcome == 'failure'
        run: ./scripts/retry-window.sh "$build_started"
      - name: Retry the source export once
        if: steps.classify.outputs.retry == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: source-artifact
          outputs: type=local,dest=dist/sources
          cache-from: type=gha,scope=sources
          cache-to: type=gha,mode=max,scope=sources
      - name: Fail on an unretried export failure
        if: >-
          steps.export.outcome == 'failure' &&
          steps.classify.outputs.retry != 'true'
        run: exit 1
      - name: Package corresponding sources
        run: ./scripts/package-sources.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statics-sources
          path: |
            dist/statics-sources.tar.xz
            dist/statics-sources.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  attest_builds:
    name: Attest ${{ matrix.arch }}
    if: >-
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write # Record the artifact attestation.
      contents: read
      id-token: write # Sign the attestation through GitHub OIDC.
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv6-hardfloat
          - armv7-hardfloat
          - armv7-softfloat
          - mips
          - mipsel
          - powerpc
          - powerpc64
          - powerpc64le
          - riscv64
          - s390x
    steps:
      - name: Download ${{ matrix.arch }} release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: statics-${{ matrix.arch }}
          path: attest
      - name: Attest release archive and SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: attest/statics-${{ matrix.arch }}.tar.xz
          sbom-path: attest/statics-${{ matrix.arch }}.spdx.json

  attest_source:
    name: Attest corresponding sources
    if: >-
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      github.event.repository.visibility == 'public'
    needs: source-bundle
    runs-on: ubuntu-24.04
    permissions:
      attestations: write # Record the artifact attestation.
      contents: read
      id-token: write # Sign the attestation through GitHub OIDC.
    steps:
      - name: Download corresponding-source assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: statics-sources
          path: attest
      - name: Attest corresponding-source archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: attest/statics-sources.tar.xz

  release:
    name: Publish release
    if: >-
      always() &&
      (inputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v')) &&
      needs.build.result == 'success' &&
      needs.reproducibility.result == 'success' &&
      needs.source-bundle.result == 'success' &&
      (needs.attest_builds.result == 'success' ||
      needs.attest_builds.result == 'skipped') &&
      (needs.attest_source.result == 'success' ||
      needs.attest_source.result == 'skipped')
    needs:
      - build
      - reproducibility
      - source-bundle
      - attest_builds
      - attest_source
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the release tag, GitHub Release, and assets.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.ref }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statics-*
          path: release
          merge-multiple: true
      - name: Verify downloaded assets
        run: |
          cd release
          for checksum_file in *.sha256; do
            sha256sum --check "$checksum_file"
          done
      - name: Create the annotated release tag
        if: inputs.release_tag != ''
        run: |
          set -euo pipefail
          if [[ ! $RELEASE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_tag requires ref to be a full commit SHA" >&2
            exit 1
          fi
          tag_ref="repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG already exists; leaving it untouched"
            exit 0
          fi
          # The workflow token cannot sign, so record an annotated tag and the
          # reason a signature is unavailable, per the release policy.
          tag_object=$(gh api "repos/$GH_REPO/git/tags" \
            --method POST \
            --raw-field tag="$RELEASE_TAG" \
            --raw-field object="$RELEASE_SHA" \
            --raw-field type=commit \
            --raw-field message="$RELEASE_TAG
          Automated release built by $GH_REPO run $GITHUB_RUN_ID.
          Unsigned: the GitHub Actions token has no release signing key." \
            --jq '.sha')
          gh api "repos/$GH_REPO/git/refs" \
            --method POST \
            --raw-field ref="refs/tags/$RELEASE_TAG" \
            --raw-field sha="$tag_object"
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            exit 0
          fi
          publish=(gh release create "$RELEASE_TAG" release/*
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG")
          if [[ -n ${RELEASE_SHA:-} ]]; then
            publish+=(--notes "Automated release from commit \`$RELEASE_SHA\`.
          Every architecture was built and verified under QEMU, and x86-64 was
          independently rebuilt and compared, before publication. Verify the
          SHA-256 files, SBOM, and attestations before deploying, and see
          \`docs/RELEASING.md\` for what this automation does not review.")
          fi
          "${publish[@]}"
