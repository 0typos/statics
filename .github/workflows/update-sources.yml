name: Check upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 5"

permissions:
  contents: read

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  update:
    name: Refresh pinned upstream sources
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Dispatch the full build for the update branch.
      contents: write # Create and update the automation branch.
      pull-requests: write # Open or refresh the dependency pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover releases and refresh checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update_sources.py --write | tee update-summary.txt
      - name: Open an update pull request
        id: update-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/update-sources
          delete-branch: true
          commit-message: "chore: update pinned upstream sources"
          title: "chore: update pinned upstream sources"
          body: |
            Automated upstream release check.

            Source archives were downloaded and SHA-256 pins were regenerated.
            CI must cross-build and QEMU-smoke-test every architecture before merge.
            Maintainers should review upstream release notes and signatures.
          labels: dependencies
          add-paths: sources.lock
      - name: Run full CI for the update commit
        if: >-
          steps.update-pr.outputs.pull-request-operation == 'created' ||
          steps.update-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: ${{ steps.update-pr.outputs.pull-request-branch }}
        run: gh workflow run build.yml --ref "$UPDATE_BRANCH"
