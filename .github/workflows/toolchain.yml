name: Toolchain image

# Builds the Dockerfile's toolchain stage from scratch and publishes it to
# GHCR, where every CI build pulls it as a layer cache instead of reinstalling
# Debian packages and re-downloading Zig (minutes per job). The Dockerfile
# remains the definition: builds never FROM this image, so any tag still
# rebuilds from the repository alone, and a stale or missing image only costs
# time. This workflow publishes only from main, but anyone who can run a
# workflow in the repository can write the package, so release builds do not
# trust it: their reproducibility rebuild ignores it (build.yml).

on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile
      - sources.lock
      - scripts/fetch.sh
      - scripts/docker-build.sh
      - .github/workflows/toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish toolchain image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Push ghcr.io/<owner>/statics-toolchain.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/statics-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build the toolchain from scratch and publish it
        # Inline cache metadata lets consumers import these layers with
        # --cache-from type=registry. --no-cache makes this the job that
        # proves the toolchain still builds from its pinned inputs.
        run: |
          set -euo pipefail
          TOOLCHAIN_IMAGE='' ./scripts/docker-build.sh toolchain \
            --no-cache \
            --cache-to type=inline \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --push
