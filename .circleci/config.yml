# All CI and release automation; the repository has no GitHub Actions.
#
#   - Pushes and pull requests (workflow `build`): validation, the full
#     architecture matrix with QEMU verification, and the corresponding-source
#     bundle. `ci-ok` is the one status branch protection requires.
#   - A v* tag (workflow `release`, also the monthly schedule): every gate
#     from a fresh build, the uncached reproducibility comparison, keyless
#     Sigstore signing through CircleCI's OIDC identity, then the GitHub
#     Release (scripts/release-candidate.sh, scripts/publish-release.sh).
#   - Schedules set `task`: weekly `reproducibility`, monthly
#     `monthly-release`, weekly `update-sources`.
#   - Main also republishes the GHCR toolchain image when its inputs change.
#
# GitHub credentials live in the `statics-publish` context, which CircleCI
# only hands to pipelines on main or a v* tag, never to an SSH rerun. Only
# repository admins can create v* tags (GitHub ruleset), so branch and pull
# request pipelines never see them. Only jobs that publish request it.
#
# Where the time goes, and what this config does about it:
#   - Every arch, the source export, and validation start at once.
#   - Reproducibility runs two uncached builds, so pushes skip it; releases
#     and the weekly schedule run it.
#   - The toolchain stage (Debian packages and a 3-4 minute Zig download) is
#     identical for every arch. Main publishes it to GHCR, and every job
#     pulls it as a layer cache (scripts/docker-build.sh). Releases trust it
#     for speed only: their reproducibility rebuild rebuilds the toolchain
#     from scratch, so a planted image cannot reproduce the shipped archive.
#   - Toolchain, sources, and compile are separate steps with plain BuildKit
#     output, so each one's time and log are visible on its own.
#   - On branches, each arch's verified output is cached under a digest of
#     every build input (scripts/build-inputs-digest.sh); unchanged inputs
#     skip the toolchain, sources, and compile and go straight to
#     verification. Caches are shared by every branch and a branch runs its
#     own config, so main and releases never restore them: they always build.
#   - QEMU downloads in the background while the build runs and installs
#     after it, so binfmt never changes under a running configure.
version: 2.1

parameters:
  arch_resource_class:
    description: Machine size for each architecture build.
    type: enum
    enum: [medium, large, xlarge, 2xlarge]
    # The Free plan, which carries the open source credits, stops at large.
    default: large
  repro_resource_class:
    description: >-
      Machine size for the reproducibility rebuild. It is the
      critical path; raise this first on a plan that allows xlarge.
    type: enum
    enum: [medium, large, xlarge, 2xlarge]
    default: large
  store_artifacts:
    description: >-
      Keep the archives as downloadable artifacts on a branch other than main.
    type: boolean
    default: false
  task:
    description: >-
      What a scheduled or manual pipeline does. `ci` is a push or pull
      request; tag pipelines release whatever this says.
    type: enum
    enum: [ci, reproducibility, monthly-release, update-sources]
    default: ci
  refresh_sources:
    description: Monthly release only. Repin every upstream component first.
    type: boolean
    default: true
  force:
    description: Monthly release only. Release even when nothing changed.
    type: boolean
    default: false

executors:
  builder:
    parameters:
      size:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.size >>
    environment:
      # Only a failure this early is retried; see scripts/retry-window.sh.
      RETRY_WINDOW_SECONDS: "600"
      DEBIAN_FRONTEND: noninteractive
  python:
    docker:
      - image: cimg/python:3.15.0@sha256:be8e26200f38ad56bd7640f199e5f7d6b8b858906fc9f7c98bd20d83b3c5af13
    resource_class: small
  base:
    docker:
      - image: cimg/base:2026.10@sha256:64becfab2860932391d834a770033665874e287a655dbef26e38df060414a79a
    resource_class: small

commands:
  skip-if-docs-only:
    description: >-
      End the job successfully when a branch changes no build input relative
      to its merge base on main. Main always builds, so a docs-only push can
      never turn a broken tree green. Any doubt builds.
    steps:
      - run:
          name: Decide whether anything build-relevant changed
          command: |
            set -euo pipefail

            base=""
            if [[ ${CIRCLE_BRANCH:-} == main ]]; then
              echo "main always builds"
              exit 0
            elif git fetch --quiet origin main; then
              base=$(git merge-base FETCH_HEAD HEAD || true)
            fi

            paths=""
            if [[ -n $base ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              paths=$(git diff --name-only "$base" HEAD)
            fi

            if [[ -z $paths ]]; then
              echo "no usable file list; building"
              exit 0
            fi
            printf '%s\n' "$paths" | sed 's/^/  /'
            if printf '%s\n' "$paths" | ./scripts/build-relevant.sh --any; then
              echo "build inputs changed; building"
            else
              echo "documentation only; skipping the expensive work"
              circleci-agent step halt
            fi

  setup-buildx:
    steps:
      - run:
          name: Start a BuildKit builder
          # The default docker driver cannot import a registry cache.
          command: |
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi
            docker buildx create --name statics --driver docker-container --bootstrap --use

  toolchain-and-sources:
    description: >-
      Pull the published toolchain as a layer cache, then fetch and verify the
      upstream sources. Both land in the job's BuildKit cache for the compile.
    parameters:
      toolchain-args:
        description: Extra buildx arguments for the toolchain step.
        type: string
        default: ""
      extra-args:
        description: Extra buildx arguments for the sources step.
        type: string
        default: ""
    steps:
      - run:
          name: Toolchain (published image as cache)
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh .build/none
            ./scripts/docker-build.sh toolchain
            << parameters.toolchain-args >>
            --output type=cacheonly
      - run:
          name: Fetch and verify upstream sources
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh .build/none
            ./scripts/docker-build.sh sources
            << parameters.extra-args >>
            --output type=cacheonly

  store-artifacts-if-wanted:
    description: >-
      Store downloadable artifacts only on main or when asked for: each
      pipeline's archives total ~240 MiB, retained for the plan's artifact
      period, and nothing else reads them.
    parameters:
      path:
        type: string
      destination:
        type: string
    steps:
      - when:
          condition:
            or:
              - equal: [main, << pipeline.git.branch >>]
              - << pipeline.parameters.store_artifacts >>
          steps:
            - store_artifacts:
                path: << parameters.path >>
                destination: << parameters.destination >>

  start-qemu-download:
    steps:
      - run:
          name: Download QEMU in the background
          # Download only: installing registers binfmt handlers, which would
          # let a running configure execute foreign binaries mid-build.
          background: true
          command: |
            rc=0
            {
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                install --yes --no-install-recommends --download-only qemu-user-static
            } >/tmp/qemu-download.log 2>&1 || rc=$?
            echo "$rc" >/tmp/qemu-download.rc

  install-qemu:
    steps:
      - run:
          name: Install QEMU
          # verify.sh fails without QEMU anyway; this surfaces the download
          # log instead of a bare "runner not found".
          command: |
            for _ in $(seq 600); do
              [[ -f /tmp/qemu-download.rc ]] && break
              sleep 1
            done
            cat /tmp/qemu-download.log
            [[ $(cat /tmp/qemu-download.rc 2>/dev/null) == 0 ]]
            sudo apt-get -o DPkg::Lock::Timeout=300 \
              install --yes --no-install-recommends --no-download qemu-user-static

  install-release-tools:
    description: Install gh and cosign, pinned to their release checksums.
    steps:
      - run:
          name: Install gh and cosign
          command: |
            set -euo pipefail
            tools=$(mktemp -d)
            curl -fsSLo "$tools/gh.tar.gz" \
              https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
            curl -fsSLo "$tools/cosign" \
              https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
            printf '%s  %s\n' \
              bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 gh.tar.gz \
              4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 cosign |
              (cd "$tools" && sha256sum --check --strict)
            tar -xzf "$tools/gh.tar.gz" -C "$tools"
            mkdir -p "$HOME/bin"
            install -m 0755 "$tools/gh_2.102.0_linux_amd64/bin/gh" "$tools/cosign" "$HOME/bin/"
            echo 'export PATH="$HOME/bin:$PATH"' >>"$BASH_ENV"

  use-release-candidate:
    description: >-
      Check out the commit release-candidate chose, or end the job
      successfully when there is nothing to release.
    steps:
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Check out the release candidate
          command: |
            set -euo pipefail
            if [[ $(cat /tmp/ws/release/release) != true ]]; then
              echo "nothing to release: $(cat /tmp/ws/release/reason)"
              circleci-agent step halt
              exit 0
            fi
            ref=$(cat /tmp/ws/release/ref)
            if [[ $(git rev-parse HEAD) != "$ref" ]]; then
              git fetch --quiet origin "$ref"
              git checkout --quiet --detach "$ref"
            fi
            echo "releasing $(cat /tmp/ws/release/tag) from $ref"

jobs:
  validate:
    parameters:
      release:
        type: boolean
        default: false
    executor: python
    steps:
      - checkout
      - when:
          condition: << parameters.release >>
          steps:
            - use-release-candidate
      - run:
          name: Install ShellCheck
          command: |
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install --yes -qq shellcheck
      - run:
          name: Validate manifests and scripts
          command: ./scripts/validate.sh
      - run:
          name: ShellCheck
          command: shellcheck scripts/*.sh scripts/builders/*.sh scripts/lib/*.sh scripts/toolchain/*

  build:
    parameters:
      arch:
        type: string
      release:
        description: >-
          Build the release candidate fresh and hand the packaged archive to
          the publish job.
        type: boolean
        default: false
    executor:
      name: builder
      size: << pipeline.parameters.arch_resource_class >>
    steps:
      - checkout
      - when:
          condition: << parameters.release >>
          steps:
            - use-release-candidate
      - unless:
          condition: << parameters.release >>
          steps:
            - skip-if-docs-only
      - start-qemu-download
      - run:
          name: Compute the build input digest
          command: |
            # The compile step's own arguments are inputs the digest cannot
            # see, so the key records them too; keep the two lists equal.
            # package.sh runs with the machine image's tar and xz, so their
            # versions are inputs to the cached archive as well.
            {
              echo "artifact ARCH=<< parameters.arch >> COMPONENT_TIMEOUT=600"
              tar --version | head -n 1
              xz --version | head -n 1
              ./scripts/build-inputs-digest.sh
            } >/tmp/build-inputs
            cat /tmp/build-inputs
      - unless:
          # One entry per arch and input digest, shared by every branch:
          # caches are per project and a branch runs its own config, so any
          # branch can write the key main would read. Main and releases
          # therefore never restore; branches trust entries only as far as
          # they trust other collaborators' branches.
          condition:
            or:
              - << parameters.release >>
              - equal: [main, << pipeline.git.branch >>]
          steps:
            - restore_cache:
                name: Restore the packaged output for unchanged inputs
                keys:
                  - statics-out-v4-<< parameters.arch >>-{{ checksum "/tmp/build-inputs" }}
      - run:
          name: Use the restored output when present
          # The cache holds the packaged archive (~10 MiB xz, about half the
          # unpacked tree's cache size). It must match its saved digest, and
          # after unpacking it is verified and repackaged like a fresh build.
          command: |
            arch=<< parameters.arch >>
            if [ -f "dist/statics-$arch.tar.xz" ] &&
              (cd dist && sha256sum --check "statics-$arch.tar.xz.sha256"); then
              mv "dist/statics-$arch.tar.xz.sha256" "dist/cached-$arch.sha256"
              tar -xJf "dist/statics-$arch.tar.xz" -C dist
              echo 'export STATICS_CACHED=1' >>"$BASH_ENV"
              echo "inputs unchanged: skipping toolchain, sources, and compile"
            else
              rm -rf dist
              echo "no cached output for these inputs: building"
            fi
      - setup-buildx
      - toolchain-and-sources
      - run:
          name: Compile << parameters.arch >>
          # COMPONENT_TIMEOUT=600: a whole arch builds in about 7.5 minutes on
          # large, so no single component nears 600 s unless the host is ~1.4x
          # slower than measured. Output is live, so 20 silent minutes means
          # a hang the guard failed to break.
          no_output_timeout: 20m
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh dist
            ./scripts/docker-build.sh artifact
            --build-arg ARCH=<< parameters.arch >>
            --build-arg JOBS="$(nproc)"
            --build-arg COMPONENT_TIMEOUT=600
            --output type=local,dest=dist
      - install-qemu
      - run:
          name: Verify and package
          command: |
            arch=<< parameters.arch >>
            ./scripts/verify.sh "dist/$arch" "$arch"
            ./scripts/package.sh "$arch"
            # package.sh is deterministic, so restored output must repackage
            # to the very archive that was cached; this also covers files
            # verify.sh does not check (notices, SBOM).
            if [ -n "${STATICS_CACHED:-}" ]; then
              cmp "dist/cached-$arch.sha256" "dist/statics-$arch.tar.xz.sha256"
            fi
            mkdir -p artifacts
            cp dist/statics-$arch.* artifacts/
      - unless:
          condition: << parameters.release >>
          steps:
            - save_cache:
                name: Save the packaged output for these inputs
                key: statics-out-v4-<< parameters.arch >>-{{ checksum "/tmp/build-inputs" }}
                paths:
                  - dist/statics-<< parameters.arch >>.tar.xz
                  - dist/statics-<< parameters.arch >>.tar.xz.sha256
      - store-artifacts-if-wanted:
          path: artifacts
          destination: statics-<< parameters.arch >>
      - when:
          condition:
            or:
              - << parameters.release >>
              - and:
                  - equal: [reproducibility, << pipeline.parameters.task >>]
                  - equal: [x86_64, << parameters.arch >>]
          steps:
            - persist_to_workspace:
                root: artifacts
                paths:
                  - statics-<< parameters.arch >>.*

  reproducibility-build:
    parameters:
      release:
        description: >-
          Also rebuild the toolchain from scratch: anyone who can push to
          main can write the published image the matrix trusts.
        type: boolean
        default: false
    executor:
      name: builder
      size: << pipeline.parameters.repro_resource_class >>
    steps:
      - checkout
      - when:
          condition: << parameters.release >>
          steps:
            - use-release-candidate
            - run:
                name: Ignore the published toolchain image
                command: echo 'export TOOLCHAIN_IMAGE=' >>"$BASH_ENV"
      - unless:
          condition: << parameters.release >>
          steps:
            - skip-if-docs-only
      - setup-buildx
      - when:
          condition: << parameters.release >>
          steps:
            - toolchain-and-sources:
                toolchain-args: --no-cache-filter zig-pin --no-cache-filter toolchain
                extra-args: --no-cache-filter sources
      - unless:
          condition: << parameters.release >>
          steps:
            - toolchain-and-sources:
                extra-args: --no-cache-filter sources
      - run:
          name: Compile x86-64 without cache
          no_output_timeout: 20m
          # Twice the matrix's make -j, so a dependence on build parallelism
          # shows up as a mismatch without slowing the critical path.
          command: |
            ./scripts/retry-once.sh dist \
              ./scripts/docker-build.sh artifact \
                --no-cache-filter builder \
                --build-arg ARCH=x86_64 \
                --build-arg JOBS="$(( $(nproc) * 2 ))" \
                --build-arg COMPONENT_TIMEOUT=600 \
                --output type=local,dest=dist
            ./scripts/package.sh x86_64
            mkdir -p rebuilt
            mv dist/statics-x86_64.tar.xz rebuilt/
      - persist_to_workspace:
          root: .
          paths:
            - rebuilt/statics-x86_64.tar.xz

  reproducibility:
    parameters:
      release:
        type: boolean
        default: false
    executor: base
    steps:
      - checkout
      - when:
          condition: << parameters.release >>
          steps:
            - use-release-candidate
      - unless:
          condition: << parameters.release >>
          steps:
            - skip-if-docs-only
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Compare the shipped archive with the rebuild
          command: >-
            ./scripts/compare-builds.sh
            /tmp/ws/statics-x86_64.tar.xz
            /tmp/ws/rebuilt/statics-x86_64.tar.xz

  ci-ok:
    # The single required status. The matrix follows architectures.tsv, so
    # requiring each arch job would drift whenever an arch is added or
    # removed. Jobs that halt on docs-only changes count as successful.
    executor: base
    steps:
      - run:
          name: Every required job passed
          command: echo "validate, all architectures, and sources passed"

  sources:
    parameters:
      release:
        type: boolean
        default: false
    # Network-bound: fetching gains nothing from more cores.
    executor:
      name: builder
      size: medium
    steps:
      - checkout
      - when:
          condition: << parameters.release >>
          steps:
            - use-release-candidate
      - unless:
          condition: << parameters.release >>
          steps:
            - skip-if-docs-only
      - run:
          name: Compute the source bundle key
          # Everything the sources stage reads (Dockerfile, pins, fetch
          # scripts) plus the packaging script.
          # package-sources.sh runs with the host's tar and xz.
          command: >-
            { cat docker/Dockerfile sources.lock scripts/fetch.sh
            scripts/fetch-sources.sh scripts/package-sources.sh;
            tar --version | head -n 1; xz --version | head -n 1; }
            | sha256sum >/tmp/sources-inputs
      - unless:
          # As for the arch outputs: main and releases never trust a shared
          # cache entry.
          condition:
            or:
              - << parameters.release >>
              - equal: [main, << pipeline.git.branch >>]
          steps:
            - restore_cache:
                name: Restore the packaged sources for unchanged pins
                keys:
                  - statics-sources-v2-{{ checksum "/tmp/sources-inputs" }}
      - run:
          name: Use the restored bundle when present
          command: |
            if [ -f dist/statics-sources.tar.xz ] && (cd dist && sha256sum --check statics-sources.tar.xz.sha256); then
              echo 'export STATICS_CACHED=1' >>"$BASH_ENV"
              echo "pins unchanged: skipping export and packaging"
            fi
      - setup-buildx
      - toolchain-and-sources
      - run:
          name: Export verified upstream source archives
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "bundle restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh dist/sources
            ./scripts/docker-build.sh source-artifact
            --output type=local,dest=dist/sources
      - run:
          name: Package corresponding sources
          command: |
            if [ -z "${STATICS_CACHED:-}" ]; then ./scripts/package-sources.sh; fi
            mkdir -p artifacts
            cp dist/statics-sources.tar.xz dist/statics-sources.tar.xz.sha256 artifacts/
      - unless:
          condition: << parameters.release >>
          steps:
            - save_cache:
                name: Save the packaged sources for these pins
                key: statics-sources-v2-{{ checksum "/tmp/sources-inputs" }}
                paths:
                  - dist/statics-sources.tar.xz
                  - dist/statics-sources.tar.xz.sha256
      - store-artifacts-if-wanted:
          path: artifacts
          destination: statics-sources
      - when:
          condition: << parameters.release >>
          steps:
            - persist_to_workspace:
                root: artifacts
                paths:
                  - statics-sources.*

  release-candidate:
    executor: python
    environment:
      GH_REPO: 0typos/statics
      RELEASE_BRANCH: automation/monthly-release
      REFRESH_SOURCES: << pipeline.parameters.refresh_sources >>
      FORCE_RELEASE: << pipeline.parameters.force >>
    steps:
      - checkout
      - install-release-tools
      - run:
          name: Choose what to release
          command: |
            export GH_TOKEN=$GITHUB_REPO_TOKEN
            ./scripts/release-candidate.sh /tmp/ws/release
      - persist_to_workspace:
          root: /tmp/ws
          paths:
            - release

  publish:
    executor: base
    environment:
      GH_REPO: 0typos/statics
      # Published binaries kept on the Releases page. Older releases are
      # removed; their tags are never deleted.
      RELEASE_KEEP: "24"
      # Fulcio certifies CircleCI jobs as their project's pipeline definition.
      SIGSTORE_ISSUER: https://oidc.circleci.com/org/c0406229-6c92-431c-9d62-ee307025beeb
      SIGSTORE_IDENTITY: https://circleci.com/api/v2/projects/ff2a4ca6-e625-4190-be64-b5fcee9a68cb/pipeline-definitions/de8b6d78-390e-4809-a387-a80e241419b3
    steps:
      - checkout
      - use-release-candidate
      - install-release-tools
      - run:
          name: Sign and publish the release
          command: |
            export GH_TOKEN=$GITHUB_REPO_TOKEN
            SIGSTORE_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"sigstore"}')
            export SIGSTORE_ID_TOKEN
            ./scripts/publish-release.sh /tmp/ws

  toolchain-image:
    # Builds the Dockerfile's toolchain stage from scratch and publishes it,
    # tagged with a digest of its inputs; an existing tag means nothing
    # changed. Builds never FROM this image, so a stale or missing one only
    # costs time.
    executor:
      name: builder
      size: medium
    environment:
      IMAGE: ghcr.io/0typos/statics-toolchain
    steps:
      - checkout
      - run:
          name: Look for an image built from these inputs
          command: |
            set -euo pipefail
            digest=$(cat docker/Dockerfile sources.lock scripts/fetch.sh scripts/docker-build.sh |
              sha256sum | cut -c1-32)
            echo "export INPUTS_TAG=inputs-$digest" >>"$BASH_ENV"
            if docker manifest inspect "$IMAGE:inputs-$digest" >/dev/null 2>&1; then
              echo "$IMAGE:inputs-$digest exists; nothing to publish"
              circleci-agent step halt
            fi
      - setup-buildx
      - run:
          name: Build the toolchain from scratch and publish it
          # Inline cache metadata lets consumers import these layers with
          # --cache-from type=registry. --no-cache makes this the job that
          # proves the toolchain still builds from its pinned inputs.
          command: |
            set -euo pipefail
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username 0typos --password-stdin
            TOOLCHAIN_IMAGE='' ./scripts/docker-build.sh toolchain \
              --no-cache \
              --cache-to type=inline \
              --label "org.opencontainers.image.source=https://github.com/0typos/statics" \
              --label "org.opencontainers.image.revision=$CIRCLE_SHA1" \
              --tag "$IMAGE:main" \
              --tag "$IMAGE:$CIRCLE_SHA1" \
              --tag "$IMAGE:$INPUTS_TAG" \
              --push

  update-sources:
    executor: python
    environment:
      GH_REPO: 0typos/statics
      UPDATE_BRANCH: automation/update-sources
    steps:
      - checkout
      - install-release-tools
      - run:
          name: Propose refreshed upstream pins
          command: |
            export GH_TOKEN=$GITHUB_REPO_TOKEN
            ./scripts/update-sources-pr.sh

workflows:
  build:
    # The monthly candidate branch is built by the release pipeline that
    # wrote it.
    when:
      and:
        - equal: [ci, << pipeline.parameters.task >>]
        - not: << pipeline.git.tag >>
        - not:
            equal: [automation/monthly-release, << pipeline.git.branch >>]
    jobs:
      - validate
      - build:
          name: build-<< matrix.arch >>
          matrix:
            parameters:
              arch:
                - x86_64
                - i686
                - aarch64
                - armv6-hardfloat
                - armv7-hardfloat
                - armv7-softfloat
                - mips
                - mipsel
                - powerpc
                - powerpc64
                - powerpc64le
                - riscv64
                - s390x
      - sources
      - ci-ok:
          requires:
            - validate
            - build
            - sources

  toolchain-image:
    when:
      and:
        - equal: [ci, << pipeline.parameters.task >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - toolchain-image:
          context: statics-publish

  # Pushing a v* tag, or the monthly schedule (task=monthly-release). The
  # publish job runs only when every gate passed.
  release:
    when:
      or:
        - matches:
            pattern: "^v.+$"
            value: << pipeline.git.tag >>
        - equal: [monthly-release, << pipeline.parameters.task >>]
    jobs:
      - release-candidate:
          context: statics-publish
          filters: &release-filters
            tags:
              only: /^v.+/
      - validate:
          release: true
          filters: *release-filters
          requires: [release-candidate]
      - build:
          name: release-<< matrix.arch >>
          release: true
          filters: *release-filters
          requires: [release-candidate]
          matrix:
            parameters:
              arch:
                - x86_64
                - i686
                - aarch64
                - armv6-hardfloat
                - armv7-hardfloat
                - armv7-softfloat
                - mips
                - mipsel
                - powerpc
                - powerpc64
                - powerpc64le
                - riscv64
                - s390x
      - reproducibility-build:
          release: true
          filters: *release-filters
          requires: [release-candidate]
      - reproducibility:
          release: true
          filters: *release-filters
          requires:
            - release-x86_64
            - reproducibility-build
      - sources:
          release: true
          filters: *release-filters
          requires: [release-candidate]
      - publish:
          context: statics-publish
          filters: *release-filters
          requires:
            - validate
            - build
            - reproducibility
            - sources

  # Weekly schedule (task=reproducibility), or by hand: rebuild x86-64
  # without cache and compare it with the matrix's archive.
  reproducibility:
    when:
      equal: [reproducibility, << pipeline.parameters.task >>]
    jobs:
      - build:
          name: build-x86_64
          arch: x86_64
      - reproducibility-build
      - reproducibility:
          requires:
            - build-x86_64
            - reproducibility-build

  # Weekly schedule (task=update-sources).
  update-sources:
    when:
      equal: [update-sources, << pipeline.parameters.task >>]
    jobs:
      - update-sources:
          context: statics-publish
