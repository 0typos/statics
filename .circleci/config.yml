# CircleCI port of the Build workflow (.github/workflows/build.yml), trialled
# side by side with GitHub Actions to compare wall-clock time.
#
# Scope: validation, the full architecture matrix with QEMU verification, the
# reproducibility check, and the corresponding-source bundle. Attestation and
# release publication stay on GitHub Actions, which owns the OIDC signing and
# the release token.
#
# Where the time goes, and what this config does about it:
#   - Actions caps the matrix at four concurrent arches; a cold build is four
#     waves of ~12 minutes. Here every arch, the reproducibility rebuild, the
#     source export, and validation start at once.
#   - Reproducibility ran two uncached builds back to back. Here one rebuild
#     of sources and compile without cache runs alongside the matrix and is
#     compared with the x86-64 archive the matrix built. CircleCI releases
#     nothing, so it never needs the release path's full toolchain rebuild.
#   - The toolchain stage (Debian packages and a 3-4 minute Zig download) is
#     identical for every arch. toolchain.yml publishes it from main, and
#     every job here pulls it as a layer cache (scripts/docker-build.sh).
#   - Toolchain, sources, and compile are separate steps with plain BuildKit
#     output, so each one's time and log are visible on its own.
#   - Each arch's verified output is cached under a digest of every build
#     input (scripts/build-inputs-digest.sh); unchanged inputs skip the
#     toolchain, sources, and compile and go straight to verification.
#   - QEMU installs in the background while the build runs.
version: 2.1

parameters:
  arch_resource_class:
    description: Machine size for each architecture build.
    type: enum
    enum: [medium, large, xlarge, 2xlarge]
    # The Free plan, which carries the open source credits, stops at large.
    default: large
  repro_resource_class:
    description: >-
      Machine size for the reproducibility rebuild. It is the
      critical path; raise this first on a plan that allows xlarge.
    type: enum
    enum: [medium, large, xlarge, 2xlarge]
    default: large

executors:
  builder:
    parameters:
      size:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.size >>
    environment:
      # Same transient-failure window as the GitHub workflow.
      RETRY_WINDOW_SECONDS: "600"
      DEBIAN_FRONTEND: noninteractive
  python:
    docker:
      - image: cimg/python:3.15.0@sha256:be8e26200f38ad56bd7640f199e5f7d6b8b858906fc9f7c98bd20d83b3c5af13
    resource_class: small
  base:
    docker:
      - image: cimg/base:2026.10@sha256:64becfab2860932391d834a770033665874e287a655dbef26e38df060414a79a
    resource_class: small

commands:
  skip-if-docs-only:
    description: >-
      End the job successfully when no build input changed. On main the push
      is compared with its predecessor; elsewhere the branch is compared with
      its merge base on main. Any doubt builds.
    steps:
      - run:
          name: Decide whether anything build-relevant changed
          command: |
            set -euo pipefail

            base=""
            if [[ ${CIRCLE_BRANCH:-} == main ]]; then
              base="<< pipeline.git.base_revision >>"
            elif git fetch --quiet origin main; then
              base=$(git merge-base FETCH_HEAD HEAD || true)
            fi

            paths=""
            if [[ -n $base ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              paths=$(git diff --name-only "$base" HEAD)
            fi

            if [[ -z $paths ]]; then
              echo "no usable file list; building"
              exit 0
            fi
            printf '%s\n' "$paths" | sed 's/^/  /'
            if printf '%s\n' "$paths" | ./scripts/build-relevant.sh --any; then
              echo "build inputs changed; building"
            else
              echo "documentation only; skipping the expensive work"
              circleci-agent step halt
            fi

  setup-buildx:
    steps:
      - run:
          name: Start a BuildKit builder
          # The default docker driver cannot import a registry cache.
          command: |
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi
            docker buildx create --name statics --driver docker-container --bootstrap --use

  toolchain-and-sources:
    description: >-
      Pull the published toolchain as a layer cache, then fetch and verify the
      upstream sources. Both land in the job's BuildKit cache for the compile.
    parameters:
      extra-args:
        description: Extra buildx arguments for the sources step.
        type: string
        default: ""
    steps:
      - run:
          name: Toolchain (published image as cache)
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh .build/none
            ./scripts/docker-build.sh toolchain --output type=cacheonly
      - run:
          name: Fetch and verify upstream sources
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh .build/none
            ./scripts/docker-build.sh sources
            << parameters.extra-args >>
            --output type=cacheonly

  start-qemu-install:
    steps:
      - run:
          name: Install QEMU in the background
          background: true
          command: |
            rc=0
            {
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                install --yes --no-install-recommends qemu-user-static
            } >/tmp/qemu-install.log 2>&1 || rc=$?
            echo "$rc" >/tmp/qemu-install.rc

  wait-for-qemu:
    steps:
      - run:
          name: Wait for the QEMU install
          # verify.sh fails without QEMU anyway; this surfaces the install
          # log instead of a bare "runner not found".
          command: |
            for _ in $(seq 600); do
              [[ -f /tmp/qemu-install.rc ]] && break
              sleep 1
            done
            cat /tmp/qemu-install.log
            [[ $(cat /tmp/qemu-install.rc 2>/dev/null) == 0 ]]

jobs:
  validate:
    executor: python
    steps:
      - checkout
      - run:
          name: Install ShellCheck
          command: |
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install --yes -qq shellcheck
      - run:
          name: Validate manifests and scripts
          command: ./scripts/validate.sh
      - run:
          name: ShellCheck
          command: shellcheck scripts/*.sh scripts/builders/*.sh scripts/lib/*.sh scripts/toolchain/*

  build:
    parameters:
      arch:
        type: string
    executor:
      name: builder
      size: << pipeline.parameters.arch_resource_class >>
    steps:
      - checkout
      - skip-if-docs-only
      - start-qemu-install
      - run:
          name: Compute the build input digest
          command: |
            { echo "<< parameters.arch >>"; ./scripts/build-inputs-digest.sh; } >/tmp/build-inputs
            cat /tmp/build-inputs
      - restore_cache:
          name: Restore compiled output for unchanged inputs
          # A branch reads its own entries and main's but saves only its own,
          # so no branch can seed output that main restores. x86-64 output is
          # also checked against the uncached rebuild in every pipeline.
          keys:
            - statics-out-v1-<< parameters.arch >>-{{ .Branch }}-{{ checksum "/tmp/build-inputs" }}
            - statics-out-v1-<< parameters.arch >>-main-{{ checksum "/tmp/build-inputs" }}
      - run:
          name: Use the restored output when present
          command: |
            if [ -f "dist/<< parameters.arch >>/BUILDINFO" ]; then
              echo 'export STATICS_CACHED=1' >>"$BASH_ENV"
              echo "inputs unchanged: skipping toolchain, sources, and compile"
            else
              echo "no cached output for these inputs: building"
            fi
      - setup-buildx
      - toolchain-and-sources
      - run:
          name: Compile << parameters.arch >>
          # make --output-sync prints each component when it finishes, so a
          # silent stretch longer than the slowest component means a hang.
          no_output_timeout: 20m
          command: >-
            if [ -n "${STATICS_CACHED:-}" ]; then echo "output restored from cache"; exit 0; fi;
            ./scripts/retry-once.sh dist
            ./scripts/docker-build.sh artifact
            --build-arg ARCH=<< parameters.arch >>
            --build-arg JOBS="$(nproc)"
            --output type=local,dest=dist
      - wait-for-qemu
      - run:
          name: Verify and package
          command: |
            ./scripts/verify.sh "dist/<< parameters.arch >>" "<< parameters.arch >>"
            ./scripts/package.sh "<< parameters.arch >>"
            mkdir -p artifacts
            cp dist/statics-<< parameters.arch >>.* artifacts/
      - save_cache:
          name: Save the verified output for these inputs
          key: statics-out-v1-<< parameters.arch >>-{{ .Branch }}-{{ checksum "/tmp/build-inputs" }}
          paths:
            - dist/<< parameters.arch >>
      - store_artifacts:
          path: artifacts
          destination: statics-<< parameters.arch >>
      - when:
          condition:
            equal: [x86_64, << parameters.arch >>]
          steps:
            - persist_to_workspace:
                root: artifacts
                paths:
                  - statics-x86_64.tar.xz

  reproducibility-build:
    executor:
      name: builder
      size: << pipeline.parameters.repro_resource_class >>
    steps:
      - checkout
      - skip-if-docs-only
      - setup-buildx
      - toolchain-and-sources:
          extra-args: --no-cache-filter sources
      - run:
          name: Compile x86-64 without cache
          no_output_timeout: 20m
          # Twice the matrix's make -j, so a dependence on build parallelism
          # shows up as a mismatch without slowing the critical path. The
          # toolchain comes from the published image; toolchain.yml is what
          # rebuilds that stage from scratch.
          command: |
            ./scripts/retry-once.sh dist \
              ./scripts/docker-build.sh artifact \
                --no-cache-filter builder \
                --build-arg ARCH=x86_64 \
                --build-arg JOBS="$(( $(nproc) * 2 ))" \
                --output type=local,dest=dist
            ./scripts/package.sh x86_64
            mkdir -p rebuilt
            mv dist/statics-x86_64.tar.xz rebuilt/
      - persist_to_workspace:
          root: .
          paths:
            - rebuilt/statics-x86_64.tar.xz

  reproducibility:
    executor: base
    steps:
      - checkout
      - skip-if-docs-only
      - attach_workspace:
          at: .build
      - run:
          name: Compare the shipped archive with the rebuild
          command: >-
            ./scripts/compare-builds.sh
            .build/statics-x86_64.tar.xz
            .build/rebuilt/statics-x86_64.tar.xz

  sources:
    executor:
      name: builder
      size: large
    steps:
      - checkout
      - skip-if-docs-only
      - setup-buildx
      - toolchain-and-sources
      - run:
          name: Export verified upstream source archives
          command: >-
            ./scripts/retry-once.sh dist/sources
            ./scripts/docker-build.sh source-artifact
            --output type=local,dest=dist/sources
      - run:
          name: Package corresponding sources
          command: |
            ./scripts/package-sources.sh
            mkdir -p artifacts
            cp dist/statics-sources.tar.xz dist/statics-sources.tar.xz.sha256 artifacts/
      - store_artifacts:
          path: artifacts
          destination: statics-sources

workflows:
  build:
    jobs:
      - validate
      - build:
          name: build-<< matrix.arch >>
          matrix:
            parameters:
              arch:
                - x86_64
                - i686
                - aarch64
                - armv6-hardfloat
                - armv7-hardfloat
                - armv7-softfloat
                - mips
                - mipsel
                - powerpc
                - powerpc64
                - powerpc64le
                - riscv64
                - s390x
      - reproducibility-build
      - reproducibility:
          requires:
            - build-x86_64
            - reproducibility-build
      - sources
